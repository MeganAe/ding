name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "api/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Non bloquant pour l'instant : à passer en bloquant une fois les
      # dernières remarques corrigées (voir AUDIT.md §6.4).
      - name: Analyse statique
        continue-on-error: true
        run: flutter analyze

      - name: Tests unitaires
        run: flutter test --reporter expanded

  build:
    name: APK de release
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Génère android/ puis applique le manifeste de référence versionné
      # (permissions, allowBackup=false, config réseau, minSdk 23).
      - name: Préparer android/
        run: bash tool/setup_android.sh

      - name: Icône de l'app
        run: dart run flutter_launcher_icons

      - name: Compiler l'APK
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Le secret API_URL n'est pas défini : l'APK ne pourrait joindre aucune API."
            exit 1
          fi
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_URL="$API_URL"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ding-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
